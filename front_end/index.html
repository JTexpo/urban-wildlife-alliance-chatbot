<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="container chat-container">
        <!--
        This is the chat history container. It displays the conversation between the user and the AI.
        -->
        <div id="chatHistory" class="chat-history">
            <div class="message assistant">
                <div class="message-bubble">
                    <!-- The initial message from the AI -->
                    Hello! How can I help you today?
                </div>
            </div>
        </div>
        <!--
        This is the input area for the user to enter their message. It includes a text area and a send button.
        -->
        <div class="input-area">
            <div class="input-group">
                <textarea id="userInput" class="form-control" rows="2" placeholder="Ask something..."></textarea>

                <button id="sendBtn" class="btn btn-primary">
                    Send
                </button>
            </div>
        </div>
    </div>
</body>

</html>

<!-- Login Modal -->
<div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Sign In</h5>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="loginUsername" class="form-label">
                        Username
                    </label>
                    <input type="text" class="form-control" id="loginUsername">
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">
                        Password
                    </label>
                    <input type="password" class="form-control" id="loginPassword">
                </div>
                <div id="loginError" class="alert alert-danger d-none">
                    Invalid username or password.
                </div>
            </div>
            <div class="modal-footer">
                <button id="loginBtn" class="btn btn-primary">
                    Sign In
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
 <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="main.js"></script>
